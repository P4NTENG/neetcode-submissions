name: Mirror to coala-study insung folder

on:
  push:
    branches: [main]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: coala-study/coding-test
          token: ${{ secrets.MIRROR_TOKEN }}
          path: target

      - name: Sync source into insung/ folder
        run: |
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            source/ target/insung/

      - name: Commit and push if changed
        run: |
          cd target
          git config user.name "neetcode-mirror-bot"
          git config user.email "actions@github.com"
          git add insung/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Sync NeetCode submissions"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            echo "Retry $i..."
            sleep 5
          done
