name: Mirror to coala-study insung folder

on:
  push:
    branches: [main]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: coala-study/coding-test
          token: ${{ secrets.MIRROR_TOKEN }}
          path: target

      - name: Sync source into insung/ folder
        run: |
            rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            source/ target/insung/

      - name: Get source commit message
        id: source_msg
        run: |
          cd source
          git log -1 --pretty=%B > ../commit_msg.txt

      - name: Commit and push if changed
        run: |
          cd target
          git config user.name "neetcode-mirror-bot"
          git config user.email "actions@github.com"
          git add insung/
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -F ../commit_msg.txt
          
          for i in 1 2 3; do
            git push origin main && break
            echo "Push failed, pulling latest main without rebase... (Retry $i)"
            git pull origin main --no-rebase -m "merge: sync target main"
            sleep 3
          done
